# Runs on every pull request and every push to main. Branch protection on main
# requires these checks to pass before anything can merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the checks still running for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leaveflow
          POSTGRES_PASSWORD: leaveflow
          POSTGRES_DB: leaveflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaveflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # tests/env.js derives leaveflow_test from this, and globalSetup creates + migrates it.
      DATABASE_URL: postgres://leaveflow:leaveflow@localhost:5432/leaveflow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test -- --coverage
        working-directory: server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: server/coverage/

  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build # a broken build is a broken deploy
        working-directory: client

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci && npm run lint
        working-directory: server
      - run: npm ci && npm run lint
        working-directory: client

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Fails the run if any dependency has a known *critical* vulnerability.
      - run: npm audit --audit-level=critical
        working-directory: server
      - run: npm audit --audit-level=critical
        working-directory: client
      - run: npm audit --audit-level=critical

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leaveflow
          POSTGRES_PASSWORD: leaveflow
          POSTGRES_DB: leaveflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaveflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://leaveflow:leaveflow@localhost:5432/leaveflow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: test-results/
