# The whole stack with one command:  docker compose up --build -d
#   web  http://localhost:8080  nginx: the React app, and /api → api
#   db-ui http://localhost:8081  Adminer, to browse the database (server: db, user/password/db: leaveflow)
#   api  (internal only)         Express; runs migrations (schema + demo users) on every start
#   db   (internal only)         Postgres 16; data kept in the "dbdata" volume
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: leaveflow
      POSTGRES_PASSWORD: leaveflow
      POSTGRES_DB: leaveflow
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaveflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://leaveflow:leaveflow@db:5432/leaveflow
      # Local-only default. Real deployments set their own: JWT_SECRET=... docker compose up
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      PORT: "4000"
      TRUST_PROXY: "1" # behind nginx: take the client IP from X-Forwarded-For
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:4000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  db-ui:
    image: adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  dbdata:
