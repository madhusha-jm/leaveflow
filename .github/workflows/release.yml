# Every merge to main publishes both images to GitHub Container Registry,
# tagged with the commit SHA (immutable) and "main" (always the latest).
name: Release

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # without this GITHUB_TOKEN is read-only and the push is denied
    strategy:
      matrix:
        include:
          - image: leaveflow-api
            context: ./server
          - image: leaveflow-web
            context: ./client
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/madhusha-jm/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/madhusha-jm/${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
