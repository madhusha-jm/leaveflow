# Dependabot opens a PR when a dependency has a security fix or a new version.
# Each PR runs the full CI, so an upgrade that breaks something can't merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /client
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # jsdom 30+ needs Node 22+; revisit together with the Node 24 LTS upgrade.
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /server
    schedule: { interval: monthly }
    ignore:
      # Node moves between LTS versions deliberately (dev machine, CI and images together),
      # not whenever a new "Current" release appears.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /client
    schedule: { interval: monthly }
    ignore:
      # Node moves between LTS versions deliberately (dev machine, CI and images together),
      # not whenever a new "Current" release appears.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
