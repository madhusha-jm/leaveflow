# In production there is no Vite dev server, so nginx takes over its two jobs:
# serve the built React app, and forward /api to the Express container.
server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    # The API's login rate limit counts per client IP — pass the real one along.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
