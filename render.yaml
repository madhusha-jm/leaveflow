# Render Blueprint — creates the whole stack in one go (Render → New → Blueprint).
# Three tiers, same as docker-compose.yml:
#   leaveflow-db   Postgres 16 (free: expires 30 days after creation — fine for the demo)
#   leaveflow-api  server/Dockerfile; runs migrations on every start, then serves
#   leaveflow-web  the React build; /api/* is forwarded to leaveflow-api
# Everything is in Singapore, the nearest region to Colombo.
databases:
  - name: leaveflow-db
    databaseName: leaveflow
    user: leaveflow
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: leaveflow-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leaveflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # a fresh random secret — prod never shares dev's
      - key: TRUST_PROXY
        value: "1" # Render's proxy sits in front: count real client IPs for the login limit

  - type: web
    name: leaveflow-web
    runtime: static
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: ./client/dist
    routes:
      # If Render gave the API a different address (the name was taken), change this
      # destination to the API's real URL in the dashboard: leaveflow-web → Redirects/Rewrites.
      - type: rewrite
        source: /api/*
        destination: https://leaveflow-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
